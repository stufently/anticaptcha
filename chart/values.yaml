# Default values for anticaptcha
replicaCount: 1

image:
  repository: ghcr.io/stufently/anticaptcha
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

securityContext: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: anticaptcha.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: anticaptcha-tls
  #    hosts:
  #      - anticaptcha.local

resources:
  # API resources
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# Worker configuration
worker:
  replicas: 1  # Only 1 replica to avoid task conflicts (SQLite)
  # Secret for the worker only. Empty means "the shared existingSecret", as
  # before. Set it to a worker-scoped Secret so ANTICAPTCHA_ADMIN_TOKEN (an
  # API-only credential) never reaches the pod that runs a browser on
  # attacker-controlled pages.
  # Empty also lets the shared Secret arrive whole via envFrom, which the env-list token filter does not cover.
  existingSecret: ""
  # File the worker touches from its event loop; the probes check its age with
  # `python -m workers.heartbeat --check --max-age <livenessProbe.maxAgeSeconds>`
  heartbeatFile: /tmp/worker-heartbeat
  livenessProbe:
    # false removes the worker livenessProbe and its startupProbe together
    enabled: true
    # Accepted heartbeat age in seconds: well above task_timeout (120 s), so a
    # long solve does not look like a dead worker
    maxAgeSeconds: 300
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  startupProbe:
    # Covers model loading: the heartbeat starts right after setup_solvers(),
    # so initialDelaySeconds is not needed. Budget: 60 x 10 s = 600 s.
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 60
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1536Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Existing secret for sensitive data (created externally)
existingSecret: ""

# Environment variables
env:
  - name: ANTICAPTCHA_DATABASE_PATH
    value: "/app/data/anticaptcha.db"
  - name: ANTICAPTCHA_MODELS_DIR
    value: "/app/models"
  - name: ANTICAPTCHA_LOG_LEVEL
    value: "INFO"
  - name: ANTICAPTCHA_WORKERS_COUNT
    value: "4"
  - name: ANTICAPTCHA_ADMIN_TOKEN
    valueFrom:
      secretKeyRef:
        name: anticaptcha-secrets
        key: admin-token
        optional: true
  - name: BAILIAN_CODING_PLAN_API_KEY
    valueFrom:
      secretKeyRef:
        name: anticaptcha-secrets
        key: bailian-api-key
        optional: true

# Persistent storage for data only (models are baked into image)
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  dataPath: /app/data

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5

# ConfigMap for additional configuration
configMap:
  enabled: false
  data: {}

# Secrets for API keys
secrets:
  enabled: false
  data: {}