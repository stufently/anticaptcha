# Default values for anticaptcha
replicaCount: 1

image:
  repository: ghcr.io/stufently/anticaptcha
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

securityContext: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: anticaptcha.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: anticaptcha-tls
  #    hosts:
  #      - anticaptcha.local

resources:
  # API resources
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# Worker configuration
worker:
  replicas: 1  # Only 1 replica to avoid task conflicts (SQLite)
  # Secret for the worker only. Empty means "the shared existingSecret", as
  # before. Set it to a worker-scoped Secret so ANTICAPTCHA_ADMIN_TOKEN (an
  # API-only credential) never reaches the pod that runs a browser on
  # attacker-controlled pages.
  # Empty mounts the shared Secret whole via envFrom; an ANTICAPTCHA_ADMIN_TOKEN
  # key in it is still blanked by an explicit env entry in the worker template.
  existingSecret: ""
  # File the worker touches from its event loop; the probes check its age with
  # `python -m workers.heartbeat --check --max-age <livenessProbe.maxAgeSeconds>`
  heartbeatFile: /tmp/worker-heartbeat
  livenessProbe:
    # false removes the worker livenessProbe and its startupProbe together
    enabled: true
    # Accepted heartbeat age in seconds: well above task_timeout (120 s), so a
    # long solve does not look like a dead worker
    maxAgeSeconds: 300
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  startupProbe:
    # Covers model loading: the heartbeat starts right after setup_solvers(),
    # so initialDelaySeconds is not needed. Budget: 60 x 10 s = 600 s.
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 60
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1536Mi

# Egress NetworkPolicy for the worker pods. The worker opens client-supplied
# pages in Chromium; the SSRF guard checks only the task page_url, so redirects,
# script navigation, fetch/frames/WebSocket of a loaded page can still reach
# internal addresses. With enabled=true the worker may only resolve DNS and
# talk to public addresses. Needs a CNI that enforces NetworkPolicy.
# The worker needs nothing inside the cluster: it shares the SQLite database
# with the API through the data volume, and the LLM endpoint is public.
networkPolicy:
  enabled: false
  dns:
    # Where cluster DNS lives. Both selectors are ANDed in one peer.
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
    ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
  ipv4:
    cidr: 0.0.0.0/0
    # Private, shared, loopback, link-local (cloud metadata 169.254.169.254),
    # documentation, benchmarking, multicast and reserved ranges.
    except:
      - 0.0.0.0/8
      - 10.0.0.0/8
      - 100.64.0.0/10
      - 127.0.0.0/8
      - 169.254.0.0/16
      - 172.16.0.0/12
      - 192.0.0.0/24
      - 192.0.2.0/24
      - 192.168.0.0/16
      - 198.18.0.0/15
      - 198.51.100.0/24
      - 203.0.113.0/24
      - 224.0.0.0/4
      - 240.0.0.0/4
    # Appended to except: IPv4 CIDRs only, e.g. public addresses of the nodes
    # or of the Kubernetes API that are not covered by the private ranges.
    extraExcept: []
  ipv6:
    # Off by default: without this rule the policy allows no IPv6 egress at
    # all, which is stricter. Turn it on in dual-stack clusters.
    enabled: false
    cidr: "::/0"
    except:
      - "::/128"
      - "::1/128"
      - "::ffff:0:0/96"
      - 64:ff9b::/96
      - 64:ff9b:1::/48
      - 100::/64
      - 2001::/23
      - 2001:db8::/32
      - 2002::/16
      - fc00::/7
      - fe80::/10
      - ff00::/8
    # Appended to except: IPv6 CIDRs only.
    extraExcept: []
  # Extra egress rules (NetworkPolicyEgressRule objects) appended as is, e.g.
  # an in-cluster proxy or LLM endpoint the worker must reach.
  extraEgress: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Existing secret for sensitive data (created externally)
existingSecret: ""

# Environment variables
env:
  - name: ANTICAPTCHA_DATABASE_PATH
    value: "/app/data/anticaptcha.db"
  - name: ANTICAPTCHA_MODELS_DIR
    value: "/app/models"
  - name: ANTICAPTCHA_LOG_LEVEL
    value: "INFO"
  - name: ANTICAPTCHA_WORKERS_COUNT
    value: "4"
  - name: ANTICAPTCHA_ADMIN_TOKEN
    valueFrom:
      secretKeyRef:
        name: anticaptcha-secrets
        key: admin-token
        optional: true
  - name: BAILIAN_CODING_PLAN_API_KEY
    valueFrom:
      secretKeyRef:
        name: anticaptcha-secrets
        key: bailian-api-key
        optional: true

# Persistent storage for data only (models are baked into image)
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  dataPath: /app/data

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5

# ConfigMap for additional configuration
configMap:
  enabled: false
  data: {}

# Secrets for API keys
secrets:
  enabled: false
  data: {}