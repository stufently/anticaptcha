# Default values for anticaptcha
replicaCount: 1

image:
  repository: anticaptcha
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: anticaptcha.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Environment variables
env:
  - name: ANTICAPTCHA_DATABASE_PATH
    value: "/app/data/anticaptcha.db"
  - name: ANTICAPTCHA_MODELS_DIR
    value: "/app/models"
  - name: ANTICAPTCHA_LOG_LEVEL
    value: "INFO"
  - name: ANTICAPTCHA_WORKERS_COUNT
    value: "4"
  - name: ANTICAPTCHA_ADMIN_TOKEN
    valueFrom:
      secretKeyRef:
        name: anticaptcha-secrets
        key: admin-token
        optional: true

# Worker configuration
worker:
  replicas: 1  # Only 1 replica to avoid task conflicts (SQLite)
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

# Persistent storage for data only (models are baked into image)
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  dataPath: /app/data

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5

# ConfigMap for additional configuration
configMap:
  enabled: false
  data: {}

# Secrets for API keys
secrets:
  enabled: false
  data: {}