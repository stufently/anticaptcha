name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Image tag must equal chart appVersion (no "v"): the chart pulls :<appVersion>.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Get chart version
        id: chart_version
        run: |
          CHART_VERSION=$(grep 'appVersion:' chart/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$CHART_VERSION" >> $GITHUB_OUTPUT
          echo "Chart appVersion: $CHART_VERSION"

      - name: Verify tag matches chart version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CHART_VERSION=${{ steps.chart_version.outputs.version }}
          if [ "$TAG_VERSION" != "$CHART_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match chart appVersion ($CHART_VERSION)"
            exit 1
          fi
          echo "✅ Tag version matches chart version: $TAG_VERSION"

      - name: Build and test Docker image
        run: |
          docker build -t anticaptcha:test .
          docker run --rm --network none -v "$PWD/tests:/app/tests:ro" anticaptcha:test python -m pytest tests -q -p no:cacheprovider

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/stufently/anticaptcha
          cache-from: type=gha
          cache-to: type=gha,mode=max