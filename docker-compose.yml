version: '3.8'

services:
  # API Server
  anticaptcha-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: anticaptcha:latest
    container_name: anticaptcha-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ANTICAPTCHA_DATABASE_PATH=/app/data/anticaptcha.db
      - ANTICAPTCHA_MODELS_DIR=/app/models
      - ANTICAPTCHA_LOG_LEVEL=INFO
      - ANTICAPTCHA_WORKERS_COUNT=4
      - ANTICAPTCHA_ADMIN_TOKEN=${ANTICAPTCHA_ADMIN_TOKEN:-}
      # Optional: Qwen API key for Vision LLM
      # - QWEN_API_KEY=${QWEN_API_KEY}
    volumes:
      - anticaptcha-data:/app/data
      - ./workers:/app/workers:ro
      - ./app:/app/app:ro
      # Optional: Mount qw2 configuration for Vision LLM
      # - ~/.qwen:/home/anticaptcha/.qwen:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - anticaptcha-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Background Worker
  anticaptcha-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: anticaptcha:latest
    container_name: anticaptcha-worker
    environment:
      - ANTICAPTCHA_DATABASE_PATH=/app/data/anticaptcha.db
      - ANTICAPTCHA_MODELS_DIR=/app/models
      - ANTICAPTCHA_LOG_LEVEL=INFO
      - ANTICAPTCHA_WORKERS_COUNT=4
      - ANTICAPTCHA_ADMIN_TOKEN=${ANTICAPTCHA_ADMIN_TOKEN:-}
      # Optional: Qwen API key for Vision LLM
      # - QWEN_API_KEY=${QWEN_API_KEY}
    volumes:
      - anticaptcha-data:/app/data
      - ./workers:/app/workers:ro
      - ./app:/app/app:ro
      # Optional: Mount qw2 configuration for Vision LLM
      # - ~/.qwen:/home/anticaptcha/.qwen:ro
    restart: unless-stopped
    depends_on:
      - anticaptcha-api
    networks:
      - anticaptcha-network
    deploy:
      replicas: 1  # Only 1 replica to avoid task conflicts
    command: python -m workers.task_worker

  # Optional: Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: anticaptcha-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - anticaptcha-network
    profiles:
      - with-redis

  # Optional: PostgreSQL для production
  postgres:
    image: postgres:15-alpine
    container_name: anticaptcha-postgres
    environment:
      - POSTGRES_DB=anticaptcha
      - POSTGRES_USER=anticaptcha
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - anticaptcha-network
    profiles:
      - with-postgres

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: anticaptcha-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - anticaptcha
    restart: unless-stopped
    networks:
      - anticaptcha-network
    profiles:
      - with-nginx

volumes:
  anticaptcha-data:
    driver: local
  anticaptcha-models:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local

networks:
  anticaptcha-network:
    driver: bridge

# Profiles для разных конфигураций
# Запуск только anticaptcha:
#   docker-compose up -d
#
# Запуск с Redis:
#   docker-compose --profile with-redis up -d
#
# Запуск с PostgreSQL:
#   docker-compose --profile with-postgres up -d
#
# Запуск с Nginx:
#   docker-compose --profile with-nginx up -d
#
# Запуск всего:
#   docker-compose --profile with-redis --profile with-postgres --profile with-nginx up -d