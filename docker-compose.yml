services:
  # API Server
  anticaptcha-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: anticaptcha:latest
    container_name: anticaptcha-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ANTICAPTCHA_DATABASE_PATH=/app/data/anticaptcha.db
      - ANTICAPTCHA_MODELS_DIR=/app/models
      - ANTICAPTCHA_LOG_LEVEL=INFO
      - ANTICAPTCHA_ADMIN_TOKEN=${ANTICAPTCHA_ADMIN_TOKEN:-}
      # Optional: Vision LLM key (reCAPTCHA v2 tiles, SmartCaptcha text task)
      # - BAILIAN_CODING_PLAN_API_KEY=${BAILIAN_CODING_PLAN_API_KEY}
    volumes:
      - anticaptcha-data:/app/data
      - ./workers:/app/workers:ro
      - ./app:/app/app:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - anticaptcha-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Background Worker
  anticaptcha-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: anticaptcha:latest
    container_name: anticaptcha-worker
    environment:
      - ANTICAPTCHA_DATABASE_PATH=/app/data/anticaptcha.db
      - ANTICAPTCHA_MODELS_DIR=/app/models
      - ANTICAPTCHA_LOG_LEVEL=INFO
      # No ANTICAPTCHA_ADMIN_TOKEN: the worker opens client pages in a browser
      # and never needs the API-only admin credential (as in the Helm chart)
      # Optional: Vision LLM key (reCAPTCHA v2 tiles, SmartCaptcha text task)
      # - BAILIAN_CODING_PLAN_API_KEY=${BAILIAN_CODING_PLAN_API_KEY}
    volumes:
      - anticaptcha-data:/app/data
      - ./workers:/app/workers:ro
      - ./app:/app/app:ro
    restart: unless-stopped
    depends_on:
      - anticaptcha-api
    networks:
      - anticaptcha-network
    deploy:
      replicas: 1  # Only 1 replica to avoid task conflicts
    command: python -m workers.task_worker

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: anticaptcha-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - anticaptcha-api
    restart: unless-stopped
    networks:
      - anticaptcha-network
    profiles:
      - with-nginx

volumes:
  anticaptcha-data:
    driver: local

networks:
  anticaptcha-network:
    driver: bridge

# Запуск API + worker:
#   docker compose up -d
#
# С nginx перед API:
#   docker compose --profile with-nginx up -d
